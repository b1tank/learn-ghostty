course:
  id: learn-ghostty
  source_commit: 6ad1fe7d8cbda36c77b337a96c9bea8a77883699
  critical_path_days: 10

lessons:
  - id: orientation-01
    title: What a terminal emulator really is
    day: 0
    estimated_minutes: 60
    prerequisites: []
    source_symbols:
      - path: src/main_ghostty.zig
        symbol: main
      - path: src/Surface.zig
        symbol: Surface

  - id: pty-01
    title: Replacing physical terminal wires with a PTY
    day: 1
    estimated_minutes: 90
    prerequisites: [orientation-01]
    lab: c-mini-pty
    source_symbols:
      - path: src/pty.zig
      - path: src/termio/Exec.zig

  - id: vt-01
    title: A byte becomes a parser action
    day: 3
    estimated_minutes: 90
    prerequisites: [pty-01, zig-01]
    lab: zig-vt-parser
    source_symbols:
      - path: src/terminal/Parser.zig
        symbol: next
      - path: src/terminal/parse_table.zig
        symbol: table

labs:
  c-mini-pty:
    cwd: labs/c/mini-pty
    run: [zig, build, run]
    check: [zig, build, test]
    timeout_seconds: 30

  zig-vt-parser:
    cwd: labs/zig/vt-parser
    run: [zig, build, run]
    check: [zig, build, test]
    timeout_seconds: 30
